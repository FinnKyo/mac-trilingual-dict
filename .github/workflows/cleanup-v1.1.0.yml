name: Delete v1.1.0 release
on:
  push:
    branches: [claude/pensive-ride-r79j2s]
permissions:
  contents: write
jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete v1.1.0 --cleanup-tag --yes --repo "$GITHUB_REPOSITORY"
