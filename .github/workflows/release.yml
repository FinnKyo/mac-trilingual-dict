name: Release

# 推送 v* 标签时：在 macOS 上打包通用二进制并发布 GitHub Release
# 发布说明取自 .github/release-notes/<标签>.md（不存在则自动生成）
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Check version
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" Resources/Info.plist)
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "标签 $GITHUB_REF_NAME 与 Info.plist 版本 $VERSION 不一致"; exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Package
        run: scripts/package.sh
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$NOTES" ]; then NOTES_ARGS=(--notes-file "$NOTES"); else NOTES_ARGS=(--generate-notes); fi
          gh release create "$GITHUB_REF_NAME" "build/DictTranslator-${VERSION}.zip" \
            --title "$GITHUB_REF_NAME" "${NOTES_ARGS[@]}"
